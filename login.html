<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | HiraHub</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <nav class="navbar container">

            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="HiraHub Icon" class="logo-img">
                <span>Hira<span class="logo-blue">Hub</span></span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="dashboard.html">My Dashboard</a></li>
            </ul>

            <div class="nav-actions">
                <label class="theme-switch" for="themeToggle" aria-label="Toggle dark mode">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider">
                        <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                </label>

                <a href="login.html" class="sign-in-button">
                    Sign In
                </a>
            </div>

        </nav>
    </header>


    <!-- MAIN CONTENT -->
    <main>
        <section class="section container auth-section">

            <div class="auth-card">
                <div class="auth-header">
                    <img src="images/logo.png" alt="HiraHub Logo" class="auth-logo">
                    <h2>Welcome to HiraHub</h2>
                    <p>Sign in with your student account or explore right away as a guest.</p>
                </div>

                <!-- CONTINUE AS GUEST (PRIMARY) -->
                <a href="dashboard.html" class="button button-primary auth-btn">
                    Continue as Guest →
                </a>

                <div class="auth-divider">
                    <span>or student sign in</span>
                </div>

                <!-- SIMPLE PLACEHOLDER FORM -->
                <form class="auth-form" action="dashboard.html" method="get">
                    <label for="studentEmail">Student Email</label>
                    <input type="email" id="studentEmail" placeholder="student@school.edu.ph">

                    <label for="studentPass">Password</label>
                    <input type="password" id="studentPass" placeholder="••••••••">

                    <button type="submit" class="button button-outline auth-btn">
                        Sign In
                    </button>
                </form>
            </div>

        </section>
    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-content">
            <p>© 2026 HiraHub. All rights reserved.</p>
        </div>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
